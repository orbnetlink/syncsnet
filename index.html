<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>Syncsnet — Next-Generation Internet & Cable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lightning-fast internet, premium cable TV and smart-home ready WiFi from Syncsnet. Plans for streaming, gaming and remote work."
    />
    <meta name="author" content="Syncsnet" />
    <meta property="og:title" content="Syncsnet — Next-Generation Internet & Cable" />
    <meta property="og:description" content="Premium internet built for modern living." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Syncsnet" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into a correct url and adds it to any other query
      // string, then redirects the browser to the correct url while preserving
      // the pathname and any query string and hash fragment.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
